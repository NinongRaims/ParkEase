name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Flask API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  node:
    name: Netlify build + helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node build.mjs
      - name: Syntax-check the function
        run: |
          for f in netlify/functions/api.mjs netlify/functions/lib/*.mjs; do node --check "$f"; done
