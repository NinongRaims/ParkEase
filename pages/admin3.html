<!DOCTYPE html>
<html lang="en">
<head>
    <title>Establishments</title>
    <link rel="stylesheet" href="Styles/adminTable.css">
    <link rel="stylesheet" href="Styles/headerAdmin.css">
    <link rel="stylesheet" href="Styles/sidePanelAdmin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="Styles/common.css">
    <link rel="stylesheet" href="Styles/dark.css">
    <script src="js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <!--HEADER-->
    <div class="header">
        <div class="left-section">
            <h2>Establishments</h2>
        </div>

        <div class="right-section">
            <a href="#" id="notifications-link">
                <i class="fa-solid fa-bell"></i>
                Notifications
            </a>
            <span>&#124;</span>
            <a href="#" id="account-link">
                <i class="fa-solid fa-user"></i>
                Account
            </a>
        </div>
    </div>
    <!--HEADER-->

    <!--SIDE PANEL-->
    <div class="side-panel">
        <input type="checkbox" class="checkbox" id="side-toggle">

        <div class="side-head">
            <div class="logo">
                <img src="Images/ParkEaseLogo.png">
            </div>

            <label for="side-toggle" class="close-side-button">
                <span></span>
            </label>
        </div>

        <div class="admin-profile">
            <p>ADMIN</p>
        </div>

        <div class="menu">

            <div class="menu-item">
                <a href="admin.html">
                    <i class="fa-solid fa-gauge"></i>
                    Dashboard
                </a>
            </div>

            <div class="menu-item">
                <a href="admin2.html">
                    <i class="fa-solid fa-users"></i>
                    Users
                </a>
            </div>

            <div class="menu-item active">
                <a href="admin3.html">
                    <i class="fa-solid fa-building"></i>
                    Establishments
                </a>
            </div>

            <div class="menu-item">
                <a href="admin4.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Reports
                </a>
            </div>

        </div>

        <div class="darkMode-button">
            <button id="darkModeToggle" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>
    <!--SIDE PANEL-->

    <!--CONTENT-->
    <div class="main-content">

        <div class="table-card">

            <div class="table-container">

                <table class="admin-table">

                    <thead>
                        <tr>
                            <th>Establishment ID</th>
                            <th>Establishment Name</th>
                            <th>Location</th>
                            <th>Contact Number</th>
                            <th>Reservations</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="establishments-body"></tbody>

                </table>

            </div>

        </div>

    </div>
    <!--CONTENT-->
    <script src="js/common.js"></script>
    <script src="js/admin3.js"></script>
</body>
</html>
