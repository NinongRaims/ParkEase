<!DOCTYPE html>
<html lang="en">
<head>
    <title>Parking Slots</title>
    <link rel="stylesheet" href="Styles/establishment2.css">
    <link rel="stylesheet" href="Styles/establishment3.css">
    <link rel="stylesheet" href="Styles/header.css">
    <link rel="stylesheet" href="Styles/sidePanelEstablishment.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="Styles/common.css">
    <link rel="stylesheet" href="Styles/dark.css">
    <script src="js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <!--HEADER-->
    <div class="header">
        <div class="left-section">
            <h2>Parking Slots</h2>
        </div>

        <div class="right-section">
            <a href="#" id="about-link">
                <i class="fa-solid fa-circle-info"></i>
                About
            </a>
            <span>&#124;</span>
            <a href="#" id="contact-link">
                <i class="fa-solid fa-envelope"></i>
                Contact
            </a>
            <span>&#124;</span>
            <a href="#" id="notifications-link">
                <i class="fa-solid fa-bell"></i>
                Notifications
            </a>
            <span>&#124;</span>
            <a href="#" id="account-link">
                <i class="fa-solid fa-user"></i>
                Account
            </a>
        </div>
    </div>
    <!--HEADER-->

    <!--SIDE PANEL-->
    <div class="side-panel">
        <input type="checkbox" class="checkbox" id="side-toggle">

        <div class="side-head">
            <div class="logo">
                <img src="Images/ParkEaseLogo.png">
            </div>

            <label for="side-toggle" class="close-side-button">
                <span></span>
            </label>
        </div>

        <div class="profile">
            <img src="Images/blankProfile.png">
        </div>

        <div class="menu">
            <div class="menu-item">
                <a href="establishment.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Overview
                </a>
            </div>

            <div class="menu-item active">
                <a href="establishment3.html">
                    <i class="fa-solid fa-square-parking"></i>
                    Parking Slots
                </a>
            </div>

            <div class="menu-item">
                <a href="establishment2.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Reservations
                </a>
            </div>
        </div>

        <div class="darkMode-button">
            <button id="darkModeToggle" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>
    <!--SIDE PANEL-->

    <!--CONTENT-->
    <div class="main-content">

        <div class="reservations-container">

            <form id="location-form" class="location-card" autocomplete="off">
                <h3><i class="fa-solid fa-location-dot"></i> Map location</h3>
                <p>Customers find you on the map with this pin. In Google Maps, right-click your entrance and
                   click the coordinates to copy them.</p>
                <div class="location-fields">
                    <input type="text" id="loc-address" placeholder="Address" maxlength="160" required>
                    <input type="number" id="loc-lat" placeholder="Latitude" step="any" min="-90" max="90" required>
                    <input type="number" id="loc-lng" placeholder="Longitude" step="any" min="-180" max="180" required>
                    <button type="button" id="loc-here"><i class="fa-solid fa-location-crosshairs"></i> Use my location</button>
                    <button type="submit">Save location</button>
                </div>
            </form>

            <div class="slots-toolbar">
                <div class="slots-legend">
                    <span class="status available">Available</span>
                    <span class="status reserved">Reserved</span>
                    <span class="status occupied">Occupied</span>
                    <span class="status maintenance">Maintenance</span>
                </div>

                <form id="add-slot-form" autocomplete="off">
                    <input type="text" id="new-slot-code" placeholder="New slot code (e.g. C-01)" maxlength="15" required>
                    <button type="submit">Add Slot</button>
                </form>
            </div>

            <div class="slots-grid" id="slots-grid"></div>

        </div>

    </div>
    <!--CONTENT-->
    <script src="js/common.js"></script>
    <script src="js/establishment3.js"></script>
</body>
</html>
