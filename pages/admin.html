<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin</title>
    <link rel="stylesheet" href="Styles/admin.css">
    <link rel="stylesheet" href="Styles/headerAdmin.css">
    <link rel="stylesheet" href="Styles/sidePanelAdmin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="Styles/common.css">
    <link rel="stylesheet" href="Styles/dark.css">
    <script src="js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <!--HEADER-->
    <div class="header">
        <div class="left-section">
            <h2>Dashboard</h2>
        </div>

        <div class="right-section">
            <a href="#" id="notifications-link">
                <i class="fa-solid fa-bell"></i>
                Notifications
            </a>
            <span>&#124;</span>
            <a href="#" id="account-link">
                <i class="fa-solid fa-user"></i>
                Account
            </a>
        </div>
    </div>
    <!--HEADER-->

    <!--SIDE PANEL-->
    <div class="side-panel">
        <input type="checkbox" class="checkbox" id="side-toggle">

        <div class="side-head">
            <div class="logo">
                <img src="Images/ParkEaseLogo.png">
            </div>

            <label for="side-toggle" class="close-side-button">
                <span></span>
            </label>
        </div>

        <div class="admin-profile">
            <p>ADMIN</p>
        </div>

        <div class="menu">
            <div class="menu-item active">
                <a href="#">
                    <i class="fa-solid fa-gauge"></i>
                    Dashboard
                </a>
            </div>

            <div class="menu-item">
                <a href="admin2.html">
                    <i class="fa-solid fa-users"></i>
                    Users
                </a>
            </div>

            <div class="menu-item">
                <a href="admin3.html">
                    <i class="fa-solid fa-building"></i>
                    Establishments
                </a>
            </div>

            <div class="menu-item">
                <a href="admin4.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Reports
                </a>
            </div>
        </div>

        <div class="darkMode-button">
            <button id="darkModeToggle" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>
    <!--SIDE PANEL-->

    <!--CONTENT-->
    <div class="main-content">
        <div class="top-section">
            <div class="total-commissions">
                <h3>Total of Commissions</h3>
                <div class="commission-price">
                    <p id="stat-commission">₱0.00</p>
                </div>
            </div>

            <div class="total-users-establishments">
                <div class="total-users">
                    <h3>Total Users</h3>
                    <div class="users-number">
                        <p id="stat-users">–</p>
                    </div>
                </div>

                <div class="total-establishments">
                    <h3>Total Establishments</h3>
                    <div class="establishments-number">
                        <p id="stat-establishments">–</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-section">
            <table class="commission-table">
                <thead>
                    <tr>
                        <th>Establishment</th>
                        <th>Reservations</th>
                        <th>Revenue</th>
                        <th>% Commission</th>
                    </tr>
                </thead>
                <tbody id="commission-body"></tbody>
            </table>
        </div>
    </div>
    <!--CONTENT-->
    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
