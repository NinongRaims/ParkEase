<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reservations</title>
    <link rel="stylesheet" href="Styles/establishment2.css">
    <link rel="stylesheet" href="Styles/header.css">
    <link rel="stylesheet" href="Styles/sidePanelEstablishment.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="Styles/common.css">
    <link rel="stylesheet" href="Styles/dark.css">
    <script src="js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <!--HEADER-->
    <div class="header">
        <div class="left-section">
            <h2>Reservations</h2>
        </div>

        <div class="right-section">
            <a href="#" id="about-link">
                <i class="fa-solid fa-circle-info"></i>
                About
            </a>
            <span>&#124;</span>
            <a href="#" id="contact-link">
                <i class="fa-solid fa-envelope"></i>
                Contact
            </a>
            <span>&#124;</span>
            <a href="#" id="notifications-link">
                <i class="fa-solid fa-bell"></i>
                Notifications
            </a>
            <span>&#124;</span>
            <a href="#" id="account-link">
                <i class="fa-solid fa-user"></i>
                Account
            </a>
        </div>
    </div>
    <!--HEADER-->

    <!--SIDE PANEL-->
    <div class="side-panel">
        <input type="checkbox" class="checkbox" id="side-toggle">

        <div class="side-head">
            <div class="logo">
                <img src="Images/ParkEaseLogo.png">
            </div>

            <label for="side-toggle" class="close-side-button">
                <span></span>
            </label>
        </div>

        <div class="profile">
            <img src="Images/blankProfile.png">
        </div>

        <div class="menu">
            <div class="menu-item">
                <a href="establishment.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Overview
                </a>
            </div>

            <div class="menu-item">
                <a href="establishment3.html">
                    <i class="fa-solid fa-square-parking"></i>
                    Parking Slots
                </a>
            </div>

            <div class="menu-item active">
                <a href="establishment2.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Reservations
                </a>
            </div>
        </div>

        <div class="darkMode-button">
            <button id="darkModeToggle" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>
    <!--SIDE PANEL-->

    <!--CONTENT-->
    <div class="main-content">

        <div class="reservations-container">

            <div class="reservations-table-container">

                <table class="reservations-table">

                    <thead>
                        <tr>
                            <th>Reservation ID</th>
                            <th>Customer Name</th>
                            <th>Parking Slot</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Duration</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="reservations-body"></tbody>

                </table>

            </div>

        </div>

    </div>
    <!--CONTENT-->
    <script src="js/common.js"></script>
    <script src="js/establishment2.js"></script>
</body>
</html>
