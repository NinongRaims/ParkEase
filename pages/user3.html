<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Bookings</title>
    <link rel="stylesheet" href="Styles/user3.css">
    <link rel="stylesheet" href="Styles/header.css">
    <link rel="stylesheet" href="Styles/sidePanelUser.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="Styles/common.css">
    <link rel="stylesheet" href="Styles/dark.css">
    <script src="js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="left-section">
            <h2>My Bookings</h2>
        </div>

        <div class="right-section">
            <a href="#" id="about-link">
                <i class="fa-solid fa-circle-info"></i>
                About
            </a>
            <span>&#124;</span>

            <a href="#" id="contact-link">
                <i class="fa-solid fa-envelope"></i>
                Contact
            </a>
            <span>&#124;</span>

            <a href="#" id="notifications-link">
                <i class="fa-solid fa-bell"></i>
                Notifications
            </a>
            <span>&#124;</span>

            <a href="#" id="account-link">
                <i class="fa-solid fa-user"></i>
                Account
            </a>
        </div>
    </div>
    <!-- HEADER -->


    <!-- SIDE PANEL -->
    <div class="side-panel">

        <input type="checkbox" class="checkbox" id="side-toggle">

        <div class="side-head">
            <div class="logo">
                <img src="Images/ParkEaseLogo.png">
            </div>

            <label for="side-toggle" class="close-side-button">
                <span></span>
            </label>
        </div>

        <div class="profile">
            <img src="Images/blankProfile.png">
        </div>

        <div class="menu">

            <div class="menu-item">
                <a href="user.html">
                    <i class="fa-solid fa-calendar-plus"></i>
                    New Reservation
                </a>
            </div>

            <div class="menu-item">
                <a href="user2.html">
                    <i class="fa-solid fa-square-parking"></i>
                    Slots Available
                </a>
            </div>

            <div class="menu-item active">
                <a href="user3.html">
                    <i class="fa-solid fa-ticket"></i>
                    My Bookings
                </a>
            </div>

            <div class="menu-item">
                <a href="user4.html">
                    <i class="fa-solid fa-map-location-dot"></i>
                    Find Parking
                </a>
            </div>

        </div>

        <div class="darkMode-button">
            <button id="darkModeToggle" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

    </div>
    <!-- SIDE PANEL -->


    <!-- CONTENT -->
    <div class="main-content">
        <div class="booking-list" id="booking-list"></div>
    </div>
    <!-- CONTENT -->
    <script src="js/common.js"></script>
    <script src="js/user3.js"></script>
</body>
</html>
